<div class="bg-light terms">
  <div class="container">
    <h1>{{ CONSTANTS.title }}</h1>
    <p class="draft-notice">{{ CONSTANTS.draftNotice }}</p>
    @for (section of CONSTANTS.sections; track section.title) {
      <div class="section">
        <h2>{{ section.title }}</h2>
        <p>{{ section.body }}</p>
      </div>
    }
  </div>
</div>
