<div class="header1 po-relative b-b" id="top">
    <div class="container">
        <!-- Header 1 code -->
        <nav class="navbar navbar-expand-lg h1-nav">
            <a class="navbar-brand" href="#"><img src="assets/images/logos/white-text.png" alt="loom21" /></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#header1"
                aria-controls="navbarTogglerDemo02" aria-expanded="false" aria-label="Toggle navigation">
                <span class="ti-menu"></span>
            </button>

            <div class="collapse navbar-collapse" id="header1">

                <ul class="navbar-nav ms-auto mt-2 mt-lg-0">

                    <li class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                        <a class="nav-link" routerLink="/" i18n="Home menu@@home">Home</a>
                    </li>
                    <li class="nav-item" routerLinkActive="active">
                        <a class="nav-link" routerLink="/docs" i18n="Docs menu@@documentation">Documentation</a>
                    </li>
                    <li class="nav-item" routerLinkActive="active">
                        <a class="nav-link" routerLink="/pricing" i18n="Pricing menu@@pricing">Pricing</a>
                    </li>
                    <li class="nav-item" routerLinkActive="active">
                        <a class="nav-link" routerLink="/contact" i18n="contact menu@@contact">Contact</a>
                    </li>
                    <!-- Distinct Locale Switcher (Before Launch App) -->
                    <li class="nav-item" style="margin-right: 0;">
                        <div class="locale-switcher">
                            <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button"
                                id="localeDropdown" data-bs-toggle="dropdown" aria-expanded="false"
                                aria-label="Select language">
                                <i class="fa fa-globe"></i> {{ currentLocale | uppercase }}
                            </button>
                            <ul class="dropdown-menu locale-menu" aria-labelledby="localeDropdown">
                                <li>
                                    <a class="dropdown-item" (click)="switchLocale('en')">EN - English</a>
                                </li>
                                <li>
                                    <a class="dropdown-item" (click)="switchLocale('bg')">BG - Български</a>
                                </li>
                                <!-- Add more locales as needed -->
                            </ul>
                        </div>
                    </li>
                    <!-- Launch App Button -->
                    <li class="nav-item">
                        <a class="btn waves-effect waves-light btn-success" [href]="appUrl" target="_blank"
                            i18n="Launch app button@@launchApp">Launch App</a>
                    </li>
                </ul>
            </div>
        </nav>
        <!-- End Header 1 code -->
    </div>
</div>
