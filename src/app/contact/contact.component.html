        <div class="spacer">
            <div class="container">
                <div class="row m-0">
                    <div class="col-lg-8">
                        <div class="contact-box p-r-40">
                            <h2 class="title">Contact Us</h2>
                            <form [formGroup]="form" (ngSubmit)="onSubmit()" data-aos="fade-left"
                                data-aos-duration="1200">
                                <div class="row">
                                    <div class="col-lg-12">
                                        <div class="form-group m-t-15">
                                            <label for="name" class="mb-2">Name</label>
                                            <input formControlName="name" id="name" class="form-control" type="text"
                                                placeholder="Enter your name..." required>
                                            <div *ngIf="name!.invalid && (name!.dirty || name!.touched)"
                                                class="alert alert-danger">
                                                <div *ngIf="name!.errors?.['required']">
                                                    Name is required.
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-12">
                                        <div class="form-group m-t-15">
                                            <label for="inputEmail" class="mb-2">Email Address</label>
                                            <input formControlName="email" id="inputEmail" class="form-control"
                                                type="text" placeholder="Enter your email...">
                                            <div *ngIf="email!.invalid && (email!.dirty || email!.touched)"
                                                class="alert alert-danger">
                                                <div *ngIf="email!.errors?.['required'] || email!.errors?.['email']">
                                                    Valid email is required.
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-12">
                                        <div class="form-group m-t-15">
                                            <label for="inputBusiness" class="mb-2">Business (optional)</label>
                                            <input formControlName="business" id="inputBusiness" class="form-control"
                                                type="text" placeholder="Enter your business...">
                                        </div>
                                    </div>
                                    <div class="col-lg-12">
                                        <div class="form-group m-t-15">
                                            <label for="inputMessage" class="mb-2">Message</label>
                                            <textarea formControlName="message" rows="8" id="inputMessage"
                                                class="form-control" rows="3"
                                                placeholder="Enter your message..."></textarea>
                                            <div *ngIf="message!.invalid && (message!.dirty || message!.touched)"
                                                class="alert alert-danger">
                                                <div *ngIf="message!.errors?.['required']">
                                                    Message is required.
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-12">
                                        <button type="submit" class="btn waves-effect waves-light btn-primary m-r-20 m-t-5"><span>
                                                Submit </span></button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <!-- <div class="detail-box p-40 bg-info" data-aos="fade-right" data-aos-duration="1200">
                            <h2 class="text-white">Loom 21</h2>

                                <br> E1 8DE, United Kingdom
                            </p>
                        </div> -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
